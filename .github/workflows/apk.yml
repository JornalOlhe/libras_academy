name: Gerar APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão (ex.: 1.0.0)
        default: '1.0.0'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Aceitar licencas do SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Montar app Android (Capacitor)
        env:
          VER: ${{ inputs.version }}
        run: |
          mkdir -p app/www && cp index.html manifest.json sw.js icon-192.png icon-512.png app/www/
          cd app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Libras Academy" br.com.libras.academy --web-dir www
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/><uses-feature android:name="android.hardware.camera" android:required="false"/></manifest>#' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          for f in ic_launcher ic_launcher_round ic_launcher_foreground; do cp www/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/$f.png; done
          sed -i "s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          npx cap sync android
          cd android && ./gradlew assembleRelease --no-daemon
      - name: Assinar e alinhar
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          U=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$U" aligned.apk
          PW=$(head -c 24 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 20)
          keytool -genkeypair -keystore k.jks -storepass "$PW" -keypass "$PW" -alias libras -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Libras Academy, C=BR"
          $BT/apksigner sign --ks k.jks --ks-pass pass:$PW --key-pass pass:$PW --ks-key-alias libras --out LibrasAcademy.apk aligned.apk
          $BT/apksigner verify LibrasAcademy.apk
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
        run: |
          gh release create "v$VER" LibrasAcademy.apk --target "${{ github.sha }}" --title "Libras Academy v$VER (final)" --notes "APK final assinado para Android. Se você instalou uma versão de teste (apk-2), desinstale-a antes. Abra o arquivo, permita instalar de fontes desconhecidas e libere a câmera quando o app pedir."
